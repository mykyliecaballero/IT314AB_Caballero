
name: my_first_flutter_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish it

# The following defines the version and build number for your application.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your application needs.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.8

  # PostgreSQL database connection
  postgres: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# Flutter settings
flutter:
  uses-material-design: true

  assets:
    - assets/spider.png
    - assets/kylamarie.jpg
    - assets/satorugojo.jpg
    - assets/sugurugeto.jpg
    - assets/chosokamo.jpg
    - assets/sukuna.jpg
    - assets/makizenin.jpg
